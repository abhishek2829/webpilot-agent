# Alembic Configuration — WebPilot Agent
#
# Database migration tool for PostgreSQL (production) and SQLite (development).
# Usage:
#   alembic upgrade head          # Apply all migrations
#   alembic downgrade -1          # Roll back one migration
#   alembic revision --autogenerate -m "description"  # Generate new migration
#   alembic history               # Show migration history

[alembic]
script_location = alembic
prepend_sys_path = .

# Default to SQLite for development; override via WEBPILOT_DATABASE_URL env var
# PostgreSQL: postgresql+asyncpg://webpilot:webpilot@localhost:5432/webpilot
sqlalchemy.url = sqlite+aiosqlite:///./data/webpilot.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
