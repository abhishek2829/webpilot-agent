# ============================================================
# WebPilot Workflow: Post Content
# ============================================================
# This workflow automates the process of:
# 1. Navigating to a social platform's compose page
# 2. Typing marketing content from templates
# 3. Publishing a thread, post, or discussion
#
# Checkpoints pause for human approval before:
# - Confirming login to the platform
# - Publishing the content
# ============================================================

name: post-content
description: Post marketing content to a social platform such as a Twitter thread, LinkedIn post, or Reddit post
version: "1.0"
tags:
  - growth
  - content
  - social
  - marketing
estimated_duration_seconds: 150
author: webpilot

variables:
  platform: "twitter"                                       # default platform to post on
  content_type: "thread"                                    # type of content (thread, post, discussion)
  content_index: "1"                                        # index of the content template to use

credentials_required:
  - twitter_email
  - twitter_password

steps:
  # --- Step 1: Navigate to Twitter compose ---
  - type: navigate
    url: https://twitter.com/compose/tweet
    description: Open the Twitter/X compose page

  # --- Step 2: Wait for page load ---
  - type: wait
    wait_for: networkidle
    timeout_seconds: 15
    description: Wait for the compose interface to load

  # --- Step 3: Checkpoint — Confirm logged in ---
  - type: checkpoint
    message: >
      Social platform compose page is open ({{platform}}).
      Content type: '{{content_type}}', template index: {{content_index}}.
      Please confirm you are logged in. If not, log in manually and approve.
    screenshot: true

  # --- Step 4: Type post content ---
  - type: type
    selector: "[data-testid='tweetTextarea_0'], [role='textbox'], .public-DraftEditor-content"
    text: "Sharing content from {{content_type}} template #{{content_index}}"
    description: Type the marketing content from the selected template
    fallback_strategy: llm_vision

  # --- Step 5: Wait for content processing ---
  - type: wait
    wait_for: networkidle
    timeout_seconds: 5
    description: Wait for any content processing or media uploads

  # --- Step 6: Screenshot composed content ---
  - type: screenshot
    description: Capture the composed content before publishing

  # --- Step 7: Checkpoint — Review before posting ---
  - type: checkpoint
    message: >
      Content is composed and ready to post on {{platform}}.
      Type: {{content_type}}, Template: #{{content_index}}.
      Please review the content and confirm before publishing.
    screenshot: true

  # --- Step 8: Click Post ---
  - type: click
    selector: "[data-testid='tweetButton'], button:has-text('Post'), button:has-text('Tweet')"
    description: Click the Post button to publish the content
    fallback_strategy: llm_vision
    timeout_seconds: 10

  # --- Step 9: Wait for post to publish ---
  - type: wait
    wait_for: networkidle
    timeout_seconds: 15
    description: Wait for the post to be published

  # --- Step 10: Extract post URL ---
  - type: extract
    selector: "a[href*='/status/'], [data-testid='toast'] a, [class*='notification'] a"
    variable: POST_URL
    description: Extract the published post URL
    fallback_strategy: llm_vision
    timeout_seconds: 10
    optional: true

  # --- Step 11: Extract post ID ---
  - type: extract
    selector: "a[href*='/status/'], [data-testid='tweet'] a[href*='/status/']"
    variable: POST_ID
    description: Extract the post ID from the published URL
    fallback_strategy: llm_vision
    timeout_seconds: 10
    optional: true

  # --- Step 12: Extract initial engagement ---
  - type: extract
    selector: "[data-testid='like'], [data-testid='reply'], [data-testid='retweet'], [role='group'] span"
    variable: ENGAGEMENT_INITIAL
    description: Capture initial engagement metrics (likes, replies, retweets)
    fallback_strategy: llm_vision
    timeout_seconds: 10
    optional: true

  # --- Step 13: Screenshot published post ---
  - type: screenshot
    description: Capture the published post with engagement metrics

  # --- Step 14: Final screenshot ---
  - type: screenshot
    description: Capture final state of content posting workflow for the execution log
